name: Check

# The site is served by GitHub Pages straight from the repository root
# (Settings → Pages → Deploy from a branch → main / root). This only checks
# that the source still validates and builds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build
